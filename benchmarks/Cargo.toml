[package]
name = "fastmetrics-benchmarks"
version = "0.0.0"
edition.workspace = true
rust-version = "1.98.0"
license.workspace = true
publish = false

[dev-dependencies]
criterion = "0.8"
fastmetrics = { path = "../fastmetrics", features = ["derive", "protobuf"] }
measured = "0.1.0"
measured-prometheus-protobuf = "0.1.0"
measured-prometheus-text = "0.1.0"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = [
    "protobuf",
] }
metrics-util = { version = "0.20", default-features = false, features = ["registry"] }
pprof = { version = "0.15.0", default-features = false, features = [
    "criterion",
    "flamegraph",
    # Enable the feature on Mac M1
    "frame-pointer",
] }
prometheus = "0.14"
prometheus-client = { version = "0.25", features = ["prometheus_protobuf"] }
prost = "0.14"
rand = "0.10"

[[bench]]
name = "metric"
path = "src/metric.rs"
harness = false

[[bench]]
name = "family"
path = "src/family.rs"
harness = false

[[bench]]
name = "text"
path = "src/format/text.rs"
harness = false

[[bench]]
name = "protobuf"
path = "src/format/protobuf.rs"
harness = false
